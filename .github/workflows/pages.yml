name: Deploy to GitHub Pages

# Builds the builder app (including the viewer page) and publishes apps/builder/dist.
# Every push to main is checked here (typecheck, unit tests, end-to-end tests) before
# anything is deployed; pull requests are checked by ci.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Default for all jobs: read-only. The deploy job asks for what it needs.
permissions:
  contents: read

# One deployment at a time. A newer push replaces a queued run, but a deployment that is
# already running is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/builder/dist

  # End-to-end tests in parallel with the build; the deployment waits for both.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
